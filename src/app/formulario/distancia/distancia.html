<div class="col-6"> 
    <div class="mb-3"> 
        <form action=""> 
            <div class="form-group pt-4"> 
                <label for="num1">Numero X1:</label> 
                <input [(ngModel)]="num1" class="form-control" type="text" name="num1" id="num1" placeholder="Ingresa numero X1"> 

                <label for="num2">Numero X2:</label> 
                <input [(ngModel)]="num2" class="form-control" type="text" name="num2" id="num2" placeholder="Ingresa numero X2"> 

                <label for="num3">Numero Y1:</label> 
                <input [(ngModel)]="num3" class="form-control" type="text" name="num3" id="num3" placeholder="Ingresa numero Y1"> 

                <label for="num4">Numero Y2:</label> 
                <input [(ngModel)]="num4" class="form-control" type="text" name="num4" id="num4" placeholder="Ingresa numero Y2"> 

                <br> 
 
                <button (click)="calcular()" type="button" class="btn btn-primary"> 
                    Calcular 
                </button>  
            </div> 
        </form> 
    </div> 
</div>

<div class="col-6">
    <h2>Resultado: {{resultado}}</h2>
</div>
